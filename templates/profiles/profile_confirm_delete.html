{% extends "base.html" %}

{% block title %}Delete profile — DjangoGramm{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h1 class="h5 mb-3">Delete "{{ object.full_name }}"?</h1>
                <p class="text-muted">This cannot be undone. All posts on this profile will be deleted too.</p>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a href="{% url 'profile-detail' object.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

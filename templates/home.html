{% extends "base.html" %}

{% block title %}Home — DjangoGramm{% endblock %}

{% block content %}
    <h1>DjangoGramm</h1>

    {% if user.is_authenticated %}
        <p>Signed in as {{ user.email }}.</p>
        <p>Your feed will appear here.</p>
    {% else %}
        <p>A place to share photos.</p>
        <p>
            <a href="{% url 'account_signup' %}">Create an account</a>
            or
            <a href="{% url 'account_login' %}">log in</a>.
        </p>
    {% endif %}
{% endblock %}
